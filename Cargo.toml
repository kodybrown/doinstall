[package]
name = "doinstall"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[[bin]]
name = "doinstall-builder"
path = "src/builder.rs"

[[bin]]
name = "doinstall-server"
path = "src/server/main.rs"

[[bin]]
name = "doinstall-launcher"
path = "src/launcher.rs"

[dependencies]
anyhow = "1"
ctrlc = "3.5"
cursive = { version = "0.21.1", default-features = false, features = ["crossterm-backend"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-width = "0.2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]
members = ["xtask"]
resolver = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
