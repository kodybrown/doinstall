name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            command: ./build.sh verify
            build: ./build.sh build
            package: ./build.sh package
          - os: macos-latest
            shell: bash
            command: ./build.sh verify
            build: ./build.sh build
            package: ./build.sh package
          - os: windows-latest
            shell: cmd
            command: build.cmd verify
            build: build.cmd build
            package: build.cmd package
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Verify standalone project
        shell: ${{ matrix.shell }}
        run: ${{ matrix.command }}
      - name: Stage native tools and launcher template
        shell: ${{ matrix.shell }}
        run: ${{ matrix.build }} --stage-dir "${{ runner.temp }}/doinstall-tools"
      - name: Archive tools with Unix executable permissions
        shell: ${{ matrix.shell }}
        run: tar -czf "${{ runner.temp }}/doinstall-tools.tar.gz" -C "${{ runner.temp }}/doinstall-tools" .
      - name: Create native self-hosted installer
        shell: ${{ matrix.shell }}
        run: ${{ matrix.package }} --output-parent "${{ runner.temp }}/doinstall-installers"
      - name: Archive installers with Unix executable permissions
        shell: ${{ matrix.shell }}
        run: tar -czf "${{ runner.temp }}/doinstall-installers.tar.gz" -C "${{ runner.temp }}/doinstall-installers" .
      - uses: actions/upload-artifact@v7
        with:
          name: doinstall-installer-${{ matrix.os }}
          path: ${{ runner.temp }}/doinstall-installers.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: doinstall-tools-${{ matrix.os }}
          path: ${{ runner.temp }}/doinstall-tools.tar.gz
          if-no-files-found: error
  shim-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: rustup toolchain install stable --profile minimal
      - run: ./build.sh shim
      - run: ./build.sh shim --verify
