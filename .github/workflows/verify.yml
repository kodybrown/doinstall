name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            command: ./build.sh verify
          - os: macos-latest
            shell: bash
            command: ./build.sh verify
          - os: windows-latest
            shell: cmd
            command: build.cmd verify
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Verify standalone project
        shell: ${{ matrix.shell }}
        run: ${{ matrix.command }}
  shim-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: rustup toolchain install stable --profile minimal
      - run: ./build.sh shim
      - run: ./build.sh shim --verify
