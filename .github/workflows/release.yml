name: Verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-ref:
    # Manual runs on other branches are skipped. Version tags remain the
    # explicit publication trigger, but must select a commit already on main.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release identity and main ancestry
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            cargo run --quiet --locked --package doinstall-dev -- release version --tag "$REF_NAME"
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          else
            cargo run --quiet --locked --package doinstall-dev -- release version
          fi

  native:
    needs: validate-ref
    name: Verify and package ${{ matrix.platform }} x64
    strategy:
      fail-fast: false
      matrix:
        # macOS builds and installer acceptance are temporarily disabled.
        include:
          - os: windows-2022
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Load pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify standalone project
        run: |
          rustfmt --check --edition 2024 .tasks/_/rust/*.rs
          if [[ "$RUNNER_OS" == Windows ]]; then
            MSYS_NO_PATHCONV=1 cmd.exe /d /c build.cmd verify
          else
            ./build.sh verify
          fi
      - name: Build, inspect and exercise native deliveries
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/doinstall-release
        run: cargo run --quiet --locked --package doinstall-dev -- release build --output "$RELEASE_OUTPUT"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/doinstall-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  shim-source:
    needs: validate-ref
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: rustup show active-toolchain
      - run: ./build.sh shim
      - run: ./build.sh shim --verify

  collect:
    needs: [native, shim-source]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
      - name: Validate both platforms and create combined checksums
        env:
          SOURCE: ${{ runner.temp }}/native
          OUTPUT: ${{ runner.temp }}/release
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          args=()
          if [[ "$REF_TYPE" == tag ]]; then
            args+=(--tag "$REF_NAME" --publishing)
          fi
          cargo run --quiet --locked --package doinstall-dev -- release collect --source "$SOURCE" --output "$OUTPUT" --commit "$SOURCE_COMMIT" "${args[@]}"
          cd "$OUTPUT"
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-ready
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-ready
          path: ${{ runner.temp }}/release
      - name: Verify final assets
        working-directory: ${{ runner.temp }}/release
        run: sha256sum --check SHA256SUMS
      - name: Publish new release after uploading all assets to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ASSETS: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          # create fails if this release already exists. Never overwrite assets
          # or mutate a previous release on a rerun; a failed draft is reviewable.
          printf 'Source commit: %s\n\nNative Windows Server 2022 x64 and Ubuntu 22.04 x64 verification, archive inspection, and temporary-root install/package/uninstall acceptance passed.\n\nUse the tools archive for CI or the setup executable for interactive installation. Check SHA256SUMS before running any downloaded file. Exact toolchains and per-platform file hashes are in RELEASE-METADATA.json. Linux baseline: Ubuntu 22.04 x64 / glibc 2.35; other platforms are not release-tested.\n' "$COMMIT" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "$ASSETS"/* --verify-tag --target "$COMMIT" --title "doinstall $TAG" --draft --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --draft=false
